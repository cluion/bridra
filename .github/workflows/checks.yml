name: Checks

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      plan:
        type: string
        default: '{}'
    outputs:
      cli-artifact-id:
        description: Immutable CLI candidate produced by full release verification
        value: ${{ jobs.release-package.outputs.cli-artifact-id }}

permissions:
  contents: read

jobs:
  core-static:
    if: inputs.full || fromJSON(inputs.plan).core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Verify CI helper regressions
        run: |
          python3 -m unittest discover -s tool -p ci_test.py -v
          python3 -m unittest discover -s tool -p release_verification_test.py -v
          python3 -m unittest discover -s tool -p ios_simulator_prepare_test.py -v
      - name: Run shared static and watchdog checks once
        run: make verify-checks

  core-go:
    if: inputs.full || fromJSON(inputs.plan).core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bridra
          POSTGRES_PASSWORD: bridra
          POSTGRES_DB: bridra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridra -d bridra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRIDRA_TEST_POSTGRES_DSN: postgres://bridra:bridra@127.0.0.1:5432/bridra_test?sslmode=disable
      BRIDRA_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Run SQL and race-enabled Go coverage once
        run: make backend-sql-store-test backend-coverage BACKEND_COVERAGE_FLAGS=-race
      - name: Upload Go coverage shard
        if: ${{ always() && hashFiles('coverage/go.out') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: core-go-coverage-${{ github.run_attempt }}
          path: coverage/go.out
          if-no-files-found: error
          retention-days: 14

  core-flutter:
    if: inputs.full || fromJSON(inputs.plan).core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Run both Flutter coverage suites and Chrome once
        run: make flutter-package-coverage flutter-app-coverage flutter-web-test
      - name: Upload Flutter coverage shards
        if: ${{ always() && hashFiles('coverage/lcov.info', 'packages/bridra_flutter/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: core-flutter-coverage-${{ github.run_attempt }}
          path: |
            coverage/lcov.info
            packages/bridra_flutter/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  core:
    if: ${{ always() && (inputs.full || fromJSON(inputs.plan).core) }}
    needs: [core-static, core-go, core-flutter]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every selected core shard
        env:
          CI_FULL: ${{ inputs.full }}
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/ci.py group --group core --plan "$CI_PLAN" --full "$CI_FULL" --needs "$CI_NEEDS"
      - name: Set up Go for coverage floors
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod
      - name: Collect required Go coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-go-coverage-${{ github.run_attempt }}
          path: coverage
      - name: Collect both required Flutter profiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-flutter-coverage-${{ github.run_attempt }}
          path: .
      - name: Enforce every original coverage floor without rerunning tests
        run: |
          make coverage-report
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined coverage evidence
        if: ${{ always() && hashFiles('coverage/go.out') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: bridra-coverage
          if-no-files-found: error
          retention-days: 14
          path: |
            coverage/go.out
            coverage/lcov.info
            coverage/summary.md
            packages/bridra_flutter/coverage/lcov.info

  linux:
    if: inputs.full || fromJSON(inputs.plan).linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Build and smoke-test Linux bundle
        run: make linux-smoke

  android-web:
    if: inputs.full || fromJSON(inputs.plan).android || fromJSON(inputs.plan).web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
        with:
          android: ${{ inputs.full || fromJSON(inputs.plan).android }}
      - name: Build Android release
        if: inputs.full || fromJSON(inputs.plan).android
        run: make android-build BACKEND_URL=https://backend.example/rpc BACKEND_TOKEN=ci-token
      - name: Build Web release
        if: inputs.full || fromJSON(inputs.plan).web
        run: make web-build BACKEND_URL=https://backend.example/rpc BACKEND_TOKEN=ci-token

  android-emulator:
    if: inputs.full || fromJSON(inputs.plan).android_emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
        with:
          android: 'true'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Android Emulator HTTP recovery and transfers
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: make android-emulator-smoke

  macos:
    if: inputs.full || fromJSON(inputs.plan).macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Test macOS application lifecycle
        run: make macos-native-test
      - name: Test signed macOS sandbox bookmark handoff
        run: make macos-sandbox-smoke
      - name: Build and smoke-test macOS bundle
        run: make macos-smoke

  ios-watchdog:
    if: inputs.full || fromJSON(inputs.plan).ios_simulator
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test hosted Simulator preparation and cleanup contracts
        run: python3 -m unittest discover -s tool -p ios_simulator_prepare_test.py -v
      - name: Test iOS Simulator watchdog
        run: make ios-simulator-watchdog-test

  ios-build:
    if: inputs.full || fromJSON(inputs.plan).ios
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Build unsigned iOS release
        run: make ios-build BACKEND_URL=https://backend.example/rpc BACKEND_TOKEN=ci-token

  ios-simulator:
    if: inputs.full || fromJSON(inputs.plan).ios_simulator
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start the existing Simulator during toolchain setup
        id: simulator
        run: python3 tool/ios_simulator_prepare.py start --state "$RUNNER_TEMP/bridra-ios-preparation/state.json"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Exercise iOS Simulator HTTP round trip
        id: ios_simulator_smoke
        continue-on-error: true
        timeout-minutes: 12
        env:
          BRIDRA_IOS_SIMULATOR_DIAGNOSTICS_DIR: ${{ runner.temp }}/bridra-ios-simulator-diagnostics/initial
        run: |
          python3 tool/ios_simulator_prepare.py ready --state "$RUNNER_TEMP/bridra-ios-preparation/state.json"
          make ios-simulator-smoke DEVICE="${{ steps.simulator.outputs.device }}"
      - name: Reset iOS Simulator before one retry
        if: steps.ios_simulator_smoke.outcome == 'failure'
        run: python3 tool/ios_simulator_prepare.py reset --state "$RUNNER_TEMP/bridra-ios-preparation/state.json"
      - name: Retry iOS Simulator HTTP round trip
        id: ios_simulator_retry
        if: steps.ios_simulator_smoke.outcome == 'failure'
        timeout-minutes: 12
        env:
          BRIDRA_IOS_SIMULATOR_DIAGNOSTICS_DIR: ${{ runner.temp }}/bridra-ios-simulator-diagnostics/retry
        run: make ios-simulator-smoke DEVICE="${{ steps.simulator.outputs.device }}"
      - name: Stop the preparation worker and owned Simulator
        if: always()
        run: python3 tool/ios_simulator_prepare.py finish --state "$RUNNER_TEMP/bridra-ios-preparation/state.json"
      - name: Upload iOS Simulator failure diagnostics
        if: ${{ always() && (failure() || steps.ios_simulator_smoke.outcome == 'failure' || steps.ios_simulator_retry.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-diagnostics-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/bridra-ios-simulator-diagnostics
            ${{ runner.temp }}/bridra-ios-preparation

  ios:
    if: ${{ always() && (inputs.full || fromJSON(inputs.plan).ios || fromJSON(inputs.plan).ios_simulator) }}
    needs: [ios-watchdog, ios-build, ios-simulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every selected ios shard
        env:
          CI_FULL: ${{ inputs.full }}
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/ci.py group --group ios --plan "$CI_PLAN" --full "$CI_FULL" --needs "$CI_NEEDS"

  windows-verify:
    if: inputs.full || fromJSON(inputs.plan).windows
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      BRIDRA_SHARED_CHECKS_IN_CORE: ${{ inputs.full || fromJSON(inputs.plan).core }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Test Windows verification contracts
        run: .\tool\windows.test.ps1
      - name: Verify framework on Windows
        env:
          BRIDRA_WINDOWS_TIMINGS_PATH: ${{ runner.temp }}/bridra-windows-timings.jsonl
        run: |
          @("### Windows command timings", "", "| Task | Kind | Command | Seconds | Passed |", "| --- | --- | --- | ---: | --- |") |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          .\tool\windows.ps1 -Task verify -SharedChecksInCore:($env:BRIDRA_SHARED_CHECKS_IN_CORE -eq "true")
      - name: Upload Windows command timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verify-timings-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bridra-windows-timings.jsonl
          if-no-files-found: warn
          retention-days: 7

  windows-bundle:
    if: inputs.full || fromJSON(inputs.plan).windows
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      BRIDRA_SHARED_CHECKS_IN_CORE: ${{ inputs.full || fromJSON(inputs.plan).core }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod
      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter
      - name: Build and smoke-test Windows bundle
        env:
          BRIDRA_WINDOWS_TIMINGS_PATH: ${{ runner.temp }}/bridra-windows-timings.jsonl
        run: .\tool\windows.ps1 -Task smoke
      - name: Upload Windows command timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle-timings-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bridra-windows-timings.jsonl
          if-no-files-found: warn
          retention-days: 7

  windows:
    if: ${{ always() && (inputs.full || fromJSON(inputs.plan).windows) }}
    needs: [windows-verify, windows-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every selected windows shard
        env:
          CI_FULL: ${{ inputs.full }}
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/ci.py group --group windows --plan "$CI_PLAN" --full "$CI_FULL" --needs "$CI_NEEDS"

  release-package:
    if: inputs.full
    uses: ./.github/workflows/release-package.yml

  check-results:
    if: ${{ always() }}
    needs: [core-static, core-go, core-flutter, core, linux, android-web, android-emulator, macos, ios-watchdog, ios-build, ios-simulator, ios, windows-verify, windows-bundle, windows, release-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require selected verification jobs to succeed
        env:
          CI_FULL: ${{ inputs.full }}
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/ci.py results --plan "$CI_PLAN" --full "$CI_FULL" --needs "$CI_NEEDS"
