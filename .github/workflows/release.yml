name: Release

on:
  push:
    tags:
      - 'backend/v*.*.*'

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  public-release:
    if: ${{ vars.BRIDRA_PUBLIC_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: public-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#backend/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Bridra release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tagged main commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag must point at current main: tag=$GITHUB_SHA main=$main_sha" >&2
            exit 1
          fi
          verify_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow verify.yml \
            --branch main \
            --commit "$GITHUB_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$verify_run_id" ]]; then
            echo "No successful main Verify workflow found for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "Using successful main Verify workflow $verify_run_id"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh -o /tmp/fvm-install.sh
          bash /tmp/fvm-install.sh 4.1.2
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        run: fvm install

      - name: Verify aligned release version
        run: make release-check VERSION='${{ steps.release.outputs.version }}' FINAL=1

      - name: Build deterministic CLI archives
        run: make cli-release

      - name: Validate Dart package
        working-directory: packages/bridra_flutter
        run: fvm dart pub publish --dry-run

      - name: Check Dart package publication
        id: pubdev
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          status="$(curl -sS \
            --output /tmp/bridra-pubdev-version.json \
            --write-out '%{http_code}' \
            "https://pub.dev/api/packages/bridra_flutter/versions/$VERSION")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              cat /tmp/bridra-pubdev-version.json >&2
              echo "pub.dev version lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Publish Dart package
        if: ${{ vars.BRIDRA_PUBDEV_AUTOMATION_ENABLED == 'true' && steps.pubdev.outputs.published != 'true' }}
        working-directory: packages/bridra_flutter
        run: fvm dart pub publish --force

      - name: Require manual Dart publication
        if: ${{ vars.BRIDRA_PUBDEV_AUTOMATION_ENABLED != 'true' && steps.pubdev.outputs.published != 'true' }}
        run: |
          echo "Publish bridra_flutter ${{ steps.release.outputs.version }} before approving this workflow" >&2
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/bridra/cli/$VERSION/"* \
            --verify-tag \
            --title "Bridra $VERSION" \
            --generate-notes
