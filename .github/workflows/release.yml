name: Release

on:
  push:
    tags:
      - 'backend/v*.*.*'

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  source:
    if: ${{ vars.BRIDRA_PUBLIC_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version and require a commit on main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#backend/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Bridra release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$(cat VERSION)" = "$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: source
    uses: ./.github/workflows/checks.yml
    with:
      full: true

  public-release:
    needs: [source, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: public-release
    permissions:
      actions: read
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out verified release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the verified artifact and unchanged tag
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.verify.outputs.cli-artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
      - name: Download the verified CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.cli-artifact-id }}
          merge-multiple: true
          path: build/bridra/cli/${{ needs.source.outputs.version }}
      - name: Recheck downloaded artifact identity and digests
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: python3 tool/ci.py artifacts --directory "build/bridra/cli/$VERSION" --version "$VERSION" --commit "$GITHUB_SHA"

      - name: Configure pub.dev OIDC
        uses: dart-lang/setup-dart@v1

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh -o /tmp/fvm-install.sh
          bash /tmp/fvm-install.sh 4.1.2
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        run: fvm install

      - name: Configure Flutter SDK environment
        shell: bash
        run: |
          flutter_version="$(fvm api project | jq -r '.project.pinnedVersion.name // empty')"
          flutter_root="$(fvm api list | jq -r --arg version "$flutter_version" \
            '[.versions[] | select(.name == $version) | .directory][0] // empty')"
          if [[ -z "$flutter_root" || ! -x "$flutter_root/bin/cache/dart-sdk/bin/dart" ]]; then
            echo "Unable to resolve installed Flutter SDK $flutter_version" >&2
            exit 1
          fi
          echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"
          echo "$flutter_root/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Attest CLI build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/bridra/cli/${{ needs.source.outputs.version }}/*.tar.gz
            build/bridra/cli/${{ needs.source.outputs.version }}/*.zip
            build/bridra/cli/${{ needs.source.outputs.version }}/SHA256SUMS
            build/bridra/cli/${{ needs.source.outputs.version }}/manifest.json
            build/bridra/cli/${{ needs.source.outputs.version }}/*.spdx.json

      - name: Attest CLI SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/bridra/cli/${{ needs.source.outputs.version }}/*.tar.gz
            build/bridra/cli/${{ needs.source.outputs.version }}/*.zip
          sbom-path: build/bridra/cli/${{ needs.source.outputs.version }}/bridra_${{ needs.source.outputs.version }}_cli.spdx.json

      - name: Check Dart package publication
        id: pubdev
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          status="$(curl -sS \
            --output /tmp/bridra-pubdev-version.json \
            --write-out '%{http_code}' \
            "https://pub.dev/api/packages/bridra_flutter/versions/$VERSION")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              cat /tmp/bridra-pubdev-version.json >&2
              echo "pub.dev version lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Publish Dart package
        if: ${{ vars.BRIDRA_PUBDEV_AUTOMATION_ENABLED == 'true' && steps.pubdev.outputs.published != 'true' }}
        timeout-minutes: 5
        working-directory: packages/bridra_flutter
        run: dart pub publish --force

      - name: Require manual Dart publication
        if: ${{ vars.BRIDRA_PUBDEV_AUTOMATION_ENABLED != 'true' && steps.pubdev.outputs.published != 'true' }}
        run: |
          echo "Publish bridra_flutter ${{ needs.source.outputs.version }} before approving this workflow" >&2
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/bridra/cli/$VERSION/"* \
            --verify-tag \
            --title "Bridra $VERSION" \
            --generate-notes
