name: Release

on:
  push:
    tags:
      - 'backend/v*.*.*'

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  source:
    if: ${{ vars.BRIDRA_PUBLIC_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      reuse: ${{ steps.evidence.outputs.reuse }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version and require a commit on main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#backend/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Bridra release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$(cat VERSION)" = "$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test release verification boundaries
        run: python3 -m unittest discover -s tool -p release_verification_test.py -v
      - name: Select matching complete PR verification or full fallback
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release_verification.py select --output "$RUNNER_TEMP/release-verification.json"
      - name: Preserve verification decision
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verification.json
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: source
    if: needs.source.outputs.reuse != 'true'
    uses: ./.github/workflows/checks.yml
    with:
      full: true

  package:
    needs: source
    if: needs.source.outputs.reuse == 'true'
    uses: ./.github/workflows/release-package.yml

  candidate:
    if: always()
    needs: [source, verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cli-artifact-id: ${{ steps.candidate.outputs.cli-artifact-id }}
    steps:
      - name: Check out release gate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the selected verification and exact-tag package
        id: candidate
        env:
          REUSE_VERIFICATION: ${{ needs.source.outputs.reuse }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/release_verification.py candidate

  public-release:
    needs: [source, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: public-release
    permissions:
      actions: read
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out verified release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the verified artifact and unchanged tag
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.candidate.outputs.cli-artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
      - name: Download the verified CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.cli-artifact-id }}
          merge-multiple: true
          path: build/bridra/cli/${{ needs.source.outputs.version }}
      - name: Recheck downloaded artifact identity and digests
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: python3 tool/ci.py artifacts --directory "build/bridra/cli/$VERSION" --version "$VERSION" --commit "$GITHUB_SHA"

      - name: Configure pub.dev OIDC
        uses: dart-lang/setup-dart@v1

      - name: Set up pinned Flutter
        uses: ./.github/actions/setup-flutter

      - name: Attest CLI build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/bridra/cli/${{ needs.source.outputs.version }}/*.tar.gz
            build/bridra/cli/${{ needs.source.outputs.version }}/*.zip
            build/bridra/cli/${{ needs.source.outputs.version }}/SHA256SUMS
            build/bridra/cli/${{ needs.source.outputs.version }}/manifest.json
            build/bridra/cli/${{ needs.source.outputs.version }}/*.spdx.json

      - name: Attest CLI SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/bridra/cli/${{ needs.source.outputs.version }}/*.tar.gz
            build/bridra/cli/${{ needs.source.outputs.version }}/*.zip
          sbom-path: build/bridra/cli/${{ needs.source.outputs.version }}/bridra_${{ needs.source.outputs.version }}_cli.spdx.json

      - name: Check Dart package publication
        id: pubdev
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          status="$(curl -sS \
            --output /tmp/bridra-pubdev-version.json \
            --write-out '%{http_code}' \
            "https://pub.dev/api/packages/bridra_flutter/versions/$VERSION")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              cat /tmp/bridra-pubdev-version.json >&2
              echo "pub.dev version lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Publish Dart package
        if: ${{ vars.BRIDRA_PUBDEV_AUTOMATION_ENABLED == 'true' && steps.pubdev.outputs.published != 'true' }}
        timeout-minutes: 5
        working-directory: packages/bridra_flutter
        run: fvm flutter pub publish --force

      - name: Require manual Dart publication
        if: ${{ vars.BRIDRA_PUBDEV_AUTOMATION_ENABLED != 'true' && steps.pubdev.outputs.published != 'true' }}
        run: |
          echo "Publish bridra_flutter ${{ needs.source.outputs.version }} before approving this workflow" >&2
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/bridra/cli/$VERSION/"* \
            --verify-tag \
            --title "Bridra $VERSION" \
            --generate-notes
