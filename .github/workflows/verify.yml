name: Verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      run_checks: ${{ steps.plan.outputs.run_checks }}
    steps:
      - name: Check out merge result
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI planning and gate contracts
        run: |
          python3 -m unittest discover -s tool -p ci_test.py -v
          python3 -m unittest discover -s tool -p release_verification_test.py -v
      - name: Select checks from both sides of renamed paths
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tool/ci.py plan --base "$BASE_SHA" --head "$HEAD_SHA"

  checks:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      plan: ${{ needs.changes.outputs.scope }}

  ci-gate:
    if: ${{ always() }}
    needs: [changes, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out merge result
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every applicable check
        env:
          CI_PLAN: ${{ needs.changes.outputs.scope }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/ci.py gate --plan "$CI_PLAN" --needs "$CI_NEEDS"
      - name: Record complete PR verification evidence for ${{ github.sha }}
        id: evidence
        env:
          CI_PLAN: ${{ needs.changes.outputs.scope }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/release_verification.py record --output "$RUNNER_TEMP/verification.json"
      - name: Upload complete PR verification evidence
        if: steps.evidence.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification.json
          if-no-files-found: error
          retention-days: 14
