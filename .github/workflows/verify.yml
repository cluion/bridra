name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-android-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bridra
          POSTGRES_PASSWORD: bridra
          POSTGRES_DB: bridra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridra -d bridra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BRIDRA_TEST_POSTGRES_DSN: postgres://bridra:bridra@127.0.0.1:5432/bridra_test?sslmode=disable
      BRIDRA_TEST_REDIS_ADDR: 127.0.0.1:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh -o /tmp/fvm-install.sh
          bash /tmp/fvm-install.sh 4.1.2
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        run: fvm install

      - name: Verify framework
        run: make verify

      - name: Enforce coverage non-regression floors
        run: |
          make coverage
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() && hashFiles('coverage/go.out') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: bridra-coverage
          if-no-files-found: error
          retention-days: 14
          path: |
            coverage/go.out
            coverage/lcov.info
            coverage/summary.md
            packages/bridra_flutter/coverage/lcov.info

      - name: Build installable CLI release artifacts
        run: make cli-release

      - name: Build and smoke-test Linux bundle
        run: make linux-smoke

      - name: Build Android release
        run: make android-build BACKEND_URL=https://backend.example/rpc BACKEND_TOKEN=ci-token

      - name: Build Web release
        run: make web-build BACKEND_URL=https://backend.example/rpc BACKEND_TOKEN=ci-token

  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh -o /tmp/fvm-install.sh
          bash /tmp/fvm-install.sh 4.1.2
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        run: fvm install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise Android Emulator HTTP recovery and transfers
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: make android-emulator-smoke

  macos-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh -o /tmp/fvm-install.sh
          bash /tmp/fvm-install.sh 4.1.2
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        run: fvm install

      - name: Build and smoke-test macOS bundle
        run: make macos-smoke

      - name: Exercise iOS Simulator HTTP round trip
        run: make ios-simulator-smoke

      - name: Build unsigned iOS release
        run: make ios-build BACKEND_URL=https://backend.example/rpc BACKEND_TOKEN=ci-token

  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/integration/sqljobstore/go.mod

      - name: Install FVM
        run: choco install fvm --version=4.1.2 --yes

      - name: Install project Flutter SDK
        run: fvm install

      - name: Verify framework on Windows
        run: .\tool\windows.ps1 -Task verify

      - name: Build and smoke-test Windows bundle
        run: .\tool\windows.ps1 -Task smoke
