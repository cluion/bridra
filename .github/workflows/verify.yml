name: Verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      run_checks: ${{ steps.plan.outputs.run_checks }}
      core: ${{ steps.plan.outputs.core }}
      linux: ${{ steps.plan.outputs.linux }}
      android: ${{ steps.plan.outputs.android }}
      web: ${{ steps.plan.outputs.web }}
      macos: ${{ steps.plan.outputs.macos }}
      ios: ${{ steps.plan.outputs.ios }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - name: Check out merge result
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI planning and gate contracts
        run: python3 -m unittest discover -s tool -p ci_test.py -v
      - name: Select checks from both sides of renamed paths
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tool/ci.py plan --base "$BASE_SHA" --head "$HEAD_SHA"

  checks:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      core: ${{ needs.changes.outputs.core == 'true' }}
      linux: ${{ needs.changes.outputs.linux == 'true' }}
      android: ${{ needs.changes.outputs.android == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}
      macos: ${{ needs.changes.outputs.macos == 'true' }}
      ios: ${{ needs.changes.outputs.ios == 'true' }}
      windows: ${{ needs.changes.outputs.windows == 'true' }}

  ci-gate:
    if: ${{ always() }}
    needs: [changes, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out merge result
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every applicable check
        env:
          CI_PLAN: ${{ needs.changes.outputs.scope }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/ci.py gate --plan "$CI_PLAN" --needs "$CI_NEEDS"
